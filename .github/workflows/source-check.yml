name: PowerFilter source check
on:
  workflow_dispatch: {}          # "Check all sources now" button in the portal, or Run workflow on GitHub
  schedule:
    - cron: '17 3 * * 1'         # every Monday 03:17 UTC
permissions:
  contents: read
concurrency:
  group: source-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - run: node .github/scripts/check-sources.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'weekly' || 'manual' }}
